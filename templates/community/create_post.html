{% extends "base.html" %}
{% block content %}

<style>
    .form-container { max-width: 700px; margin: 40px auto; padding: 0 20px; font-family: 'Inter', sans-serif; }
    .back-link { display: inline-block; color: var(--primary); text-decoration: none; font-weight: 600; font-size: 14px; margin-bottom: 20px; }
    .back-link:hover { text-decoration: underline; }

    .form-card { background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 16px; padding: 40px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
    .form-title { font-size: 28px; font-weight: 800; color: var(--text-main); margin: 0 0 8px 0; }
    .form-subtitle { color: var(--text-muted); font-size: 15px; margin: 0 0 32px 0; line-height: 1.5; }
    .form-group { margin-bottom: 24px; text-align: left; }
    .form-label { display: block; font-weight: 600; font-size: 14px; color: var(--text-main); margin-bottom: 8px; }
    
    .form-control { width: 100%; padding: 14px 16px; border: 1px solid var(--border-color); border-radius: 8px; background-color: var(--bg-body); color: var(--text-main); font-family: 'Inter', sans-serif; font-size: 15px; outline: none; transition: all 0.2s; box-sizing: border-box; }
    .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); background-color: var(--bg-surface); }
    .form-control::placeholder { color: var(--text-muted); opacity: 0.7; }

    .btn-row { display: flex; gap: 12px; margin-top: 32px; }
    .btn-cancel { flex: 1; text-align: center; background: var(--bg-body); color: var(--text-muted); text-decoration: none; padding: 14px; border-radius: 8px; font-weight: 600; font-size: 15px; border: 1px solid var(--border-color); transition: background 0.2s; }
    .btn-cancel:hover { background: var(--border-color); color: var(--text-main); }
    .btn-submit { flex: 1; background: var(--primary); color: white; border: none; padding: 14px; border-radius: 8px; font-weight: 600; font-size: 15px; cursor: pointer; transition: background 0.2s; }
    .btn-submit:hover { background: var(--primary-hover); }
</style>

<div class="form-container">
    <!-- FIXED: Using 'forum_list' from your urls.py -->
    <a href="{% url 'forum_list' %}" class="back-link">← Back to Community</a>
    
    <div class="form-card">
        <h2 class="form-title">Ask the Community</h2>
        <p class="form-subtitle">Describe your farming issue clearly so other farmers and experts can help you.</p>

        <form method="POST">
            {% csrf_token %}
            
            <div class="form-group">
                <label class="form-label">Question Title</label>
                <input type="text" name="title" required class="form-control" placeholder="e.g., Why are my tomato leaves turning yellow?">
            </div>

            <div class="form-group">
                <label class="form-label">Detailed Description</label>
                <textarea name="content" required rows="6" class="form-control" placeholder="Describe the symptoms, how long it has been happening, and any treatments you've already tried..."></textarea>
            </div>

            <div class="btn-row">
                <!-- FIXED: Using 'forum_list' from your urls.py -->
                <a href="{% url 'forum_list' %}" class="btn-cancel">Cancel</a>
                <button type="submit" class="btn-submit">Post Question</button>
            </div>
        </form>
    </div>
</div>

{% endblock %}
