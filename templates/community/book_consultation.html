{% extends "base.html" %}
{% block content %}

<style>
    .booking-container {
        max-width: 550px;
        margin: 60px auto;
        padding: 0 20px;
        font-family: 'Inter', sans-serif;
    }

    .booking-card {
        background: var(--bg-surface);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 40px;
        box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
    }

    .booking-header {
        text-align: center;
        margin-bottom: 32px;
    }

    .booking-header h2 {
        font-size: 28px;
        font-weight: 800;
        color: var(--text-main);
        margin: 0 0 8px 0;
    }

    .booking-header p {
        color: var(--text-muted);
        font-size: 15px;
        margin: 0;
    }

    .form-group {
        text-align: left;
        margin-bottom: 20px;
    }

    .form-label {
        display: block;
        font-weight: 600;
        font-size: 14px;
        color: var(--text-main);
        margin-bottom: 8px;
    }

    /* Styling both textarea and input */
    .form-control {
        width: 100%;
        padding: 14px 16px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        background-color: var(--bg-body);
        color: var(--text-main);
        font-family: 'Inter', sans-serif;
        font-size: 15px;
        outline: none;
        transition: all 0.2s;
        box-sizing: border-box;
    }

    .form-control:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px var(--primary-light);
        background-color: var(--bg-surface);
    }

    .btn-submit {
        width: 100%;
        background: var(--primary);
        color: white;
        border: none;
        padding: 16px;
        border-radius: 8px;
        font-weight: 700;
        font-size: 16px;
        cursor: pointer;
        transition: background 0.2s;
        margin-top: 10px;
    }

    .btn-submit:hover {
        background: var(--primary-hover);
    }
</style>

<div class="booking-container">
    <div class="booking-card">
        
        <div class="booking-header">
            <h2>Book Consultation</h2>
            <p>with Dr. {{ expert.user.username }}</p>
        </div>
        
        <form method="POST">
            {% csrf_token %}
            
            <div class="form-group">
                <label class="form-label">Describe your crop issue:</label>
                <textarea name="issue_description" required rows="4" class="form-control" placeholder="Please describe the symptoms, when they started, and any treatments you have tried..."></textarea>
            </div>

            <div class="form-group" style="margin-bottom: 30px;">
                <label class="form-label">Preferred Date & Time:</label>
                <input type="datetime-local" name="scheduled_time" required class="form-control">
            </div>

            <button type="submit" class="btn-submit">Confirm Booking</button>
        </form>
        
    </div>
</div>

{% endblock %}
